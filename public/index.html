<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Passion Beats</title>
<meta name="description" content="Turn a recording of beat pieces into new, humanized songs, right in your browser.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f2f2f7; --card: #ffffff; --fill: #e9e9ee; --fill-2: #dcdce2; --line: #d1d1d6;
  --text: #1c1c1e; --text-2: #6c6c70; --text-3: #8e8e93;
  --accent: #ff2d55; --accent-ink: #ffffff; --accent-soft: #ffe5ea; --danger: #d70015; --ok: #248a3d;
  --intro: #8e8e93; --verse: #007aff; --hook: #ff2d55; --break: #ff9f0a; --bridge: #af52de; --outro: #48484a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1c1c1e; --fill: #2c2c2e; --fill-2: #3a3a3c; --line: #38383a;
    --text: #f2f2f7; --text-2: #aeaeb2; --text-3: #8e8e93;
    --accent: #ff375f; --accent-soft: #3d1a22; --danger: #ff6961; --ok: #30d158;
    --intro: #98989d; --verse: #0a84ff; --hook: #ff375f; --break: #ff9f0a; --bridge: #bf5af2; --outro: #636366;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1c1c1e; --fill: #2c2c2e; --fill-2: #3a3a3c; --line: #38383a;
  --text: #f2f2f7; --text-2: #aeaeb2; --text-3: #8e8e93;
  --accent: #ff375f; --accent-soft: #3d1a22; --danger: #ff6961; --ok: #30d158;
  --intro: #98989d; --verse: #0a84ff; --hook: #ff375f; --break: #ff9f0a; --bridge: #bf5af2; --outro: #636366;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.nowrap { white-space: nowrap; }

.top { display: flex; align-items: center; gap: 12px; margin: 4px 4px 20px; }
.top img { width: 44px; height: 44px; border-radius: 11px; flex: none; }
.top h1 { margin: 0; font-size: 24px; line-height: 1.15; letter-spacing: -0.02em; white-space: nowrap; }
.top p { margin: 2px 0 0; color: var(--text-2); font-size: 14px; white-space: nowrap; }

.card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
.card[hidden] { display: none; }
.head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 32px; }
.head h2 { margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; flex: 1; min-width: 0; }
.step {
  width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700;
}

/* 1. Recording */
.drop {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px;
  border: 1.5px dashed var(--line); background: var(--fill); cursor: pointer;
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { flex: none; color: var(--accent); }
.drop b { display: block; font-weight: 600; white-space: nowrap; }
.drop span { display: block; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.demo { display: block; margin: 10px auto 0; padding: 6px 10px; border: 0; background: none; color: var(--accent); font-size: 14px; font-weight: 500; }
.status { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; white-space: nowrap; }
.status[hidden] { display: none; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.status.bad .dot { background: var(--danger); }
.status.busy .dot { background: var(--text-3); }
.status b { font-weight: 600; }
.status .file { color: var(--text-2); overflow: hidden; text-overflow: clip; min-width: 0; }
.pieces { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 12px; }
.pieces:empty { display: none; }
.piece {
  border: 0; border-radius: 10px; background: var(--fill); padding: 7px 0 6px; text-align: center;
  font-variant-numeric: tabular-nums; line-height: 1.15;
}
.piece b { display: block; font-size: 15px; font-weight: 600; }
.piece span { display: block; font-size: 11px; color: var(--text-2); }
.piece.on { background: var(--accent); color: var(--accent-ink); }
.piece.on span { color: inherit; opacity: 0.85; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.hint[hidden] { display: none; }

details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
summary { cursor: pointer; color: var(--text-2); font-size: 14px; list-style: none; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
summary::-webkit-details-marker { display: none; }
summary::before { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s; margin: 0 3px; }
details[open] summary::before { transform: rotate(45deg); }

/* settings rows */
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 6px 0; }
.row + .row, .row + .stack, .stack + .row { border-top: 1px solid var(--line); }
.row > label, .row > .label, .stack > .label { font-weight: 500; white-space: nowrap; }
.row small, .stack small { display: block; font-size: 12px; font-weight: 400; color: var(--text-2); white-space: nowrap; }
.stack { padding: 10px 0; }
.ctl { display: flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
.num {
  width: 56px; height: 36px; border-radius: 9px; border: 0; background: var(--fill);
  text-align: center; font-variant-numeric: tabular-nums; font-size: 16px;
}
.num.wide { width: 104px; }
.num.short { width: 48px; }
.num:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.stepper { display: flex; align-items: center; background: var(--fill); border-radius: 9px; height: 36px; }
.stepper button { width: 36px; height: 36px; border: 0; background: none; font-size: 20px; line-height: 1; color: var(--accent); }
.stepper button:disabled { color: var(--text-3); cursor: default; }
.stepper .num { width: 44px; background: none; }
.unit { color: var(--text-2); font-size: 14px; }
.chips { display: flex; gap: 6px; margin-top: 8px; }
.chip {
  flex: 1 1 0; min-width: 0; height: 34px; border-radius: 17px; border: 0; background: var(--fill);
  font-size: 13px; font-weight: 500; white-space: nowrap; padding: 0 4px;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 7px; font-size: 14px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
input[type="range"] { width: 120px; accent-color: var(--accent); }
.val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 14px; }

.primary {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 50px; margin-top: 14px;
  border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 600; white-space: nowrap;
}
.primary:disabled { background: var(--fill-2); color: var(--text-3); cursor: default; }
.secondary {
  height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: var(--accent-soft); color: var(--accent);
  font-size: 14px; font-weight: 600; white-space: nowrap; flex: none;
}
.secondary:disabled { opacity: .5; cursor: default; }
.error { margin: 10px 0 0; color: var(--danger); font-size: 14px; white-space: nowrap; }
.error:empty { display: none; }

/* 3. Songs */
.meta { margin: -6px 0 12px; color: var(--text-2); font-size: 13px; white-space: nowrap; }
.legend { display: grid; grid-template-columns: repeat(6, auto); justify-content: start; gap: 6px 14px; margin-bottom: 4px; font-size: 12px; color: var(--text-2); }
.legend span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
@media (max-width: 420px) { .legend { grid-template-columns: repeat(3, auto); } }
.songs { list-style: none; margin: 0; padding: 0; }
.song { padding: 14px 0; border-top: 1px solid var(--line); }
.song:first-child { border-top: 0; }
.song .line { display: flex; align-items: center; gap: 10px; }
.song .name { flex: 1; min-width: 0; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.song .info { color: var(--text-2); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.song .save {
  width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; flex: none;
  background: var(--accent-soft); color: var(--accent);
}
.plan { display: flex; gap: 2px; height: 8px; margin: 10px 0; border-radius: 4px; overflow: hidden; }
.plan i { display: block; min-width: 2px; }
.song audio { display: block; width: 100%; height: 40px; }
.busy-line { color: var(--text-2); font-size: 14px; padding: 14px 0 2px; white-space: nowrap; border-top: 1px solid var(--line); }
.busy-line:empty { display: none; }

footer { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 8px; white-space: nowrap; }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <header class="top">
    <img src="icon.svg" alt="">
    <div>
      <h1>Passion Beats</h1>
      <p>New songs from your recorded beat pieces</p>
    </div>
  </header>

  <section class="card" aria-labelledby="h-rec">
    <div class="head"><span class="step">1</span><h2 id="h-rec">Recording</h2></div>
    <label class="drop" id="drop">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10M21 12h0"/></svg>
      <div><b>Choose a recording</b><span>WAV is best · 24 pieces split by silence</span></div>
      <input type="file" id="file" accept="audio/*,.wav">
    </label>
    <button class="demo" id="demo" type="button">Or try a demo recording</button>
    <div class="status" id="status" hidden><span class="dot"></span><span id="status-text"></span></div>
    <div class="pieces" id="pieces" aria-label="Pieces: tap one to hear it"></div>
    <p class="hint" id="pieces-hint" hidden>Tap a piece to hear it · numbers are beats</p>
    <details id="split-more">
      <summary>Splitting</summary>
      <div class="row">
        <label for="silence">Silence below<small>Raise it for noisy phone audio</small></label>
        <div class="ctl"><input class="num" id="silence" type="number" min="-140" max="-30" step="5" value="-90"><span class="unit">dB</span></div>
      </div>
      <div class="row">
        <label for="gap">Shortest gap<small>Silence between two pieces</small></label>
        <div class="ctl"><input class="num" id="gap" type="number" min="0.05" max="3" step="0.05" value="0.2"><span class="unit">sec</span></div>
      </div>
      <button class="secondary" id="resplit" type="button" disabled>Split again</button>
    </details>
  </section>

  <section class="card" aria-labelledby="h-set">
    <div class="head"><span class="step">2</span><h2 id="h-set">Settings</h2></div>
    <div class="row">
      <label for="count">Songs</label>
      <div class="stepper">
        <button type="button" id="count-down" aria-label="Fewer songs">−</button>
        <input class="num" id="count" type="number" min="1" max="50" value="20" inputmode="numeric">
        <button type="button" id="count-up" aria-label="More songs">+</button>
      </div>
    </div>
    <div class="row">
      <div class="label">Length<small id="length-hint">48–56 sec each</small></div>
      <div class="ctl">
        <input class="num short" id="min-bars" type="number" min="8" max="64" value="25" inputmode="numeric" aria-label="Shortest, in bars">
        <span class="unit">–</span>
        <input class="num short" id="max-bars" type="number" min="8" max="64" value="29" inputmode="numeric" aria-label="Longest, in bars">
        <span class="unit">bars</span>
      </div>
    </div>
    <div class="stack">
      <div class="label">Drums<small>Each song picks its grooves from these</small></div>
      <div class="chips" id="styles">
        <button class="chip" type="button" data-style="four" aria-pressed="true">Four</button>
        <button class="chip" type="button" data-style="hiphop" aria-pressed="true">Hip-hop</button>
        <button class="chip" type="button" data-style="trap" aria-pressed="true">Trap</button>
        <button class="chip" type="button" data-style="half" aria-pressed="true">Half</button>
        <button class="chip" type="button" data-style="broken" aria-pressed="true">Broken</button>
      </div>
    </div>
    <div class="row">
      <label for="humanize">Humanize<small>Swing and timing drift</small></label>
      <div class="ctl"><input id="humanize" type="range" min="0" max="200" step="10" value="100"><span class="val" id="humanize-val">100%</span></div>
    </div>
    <div class="row">
      <label for="seed">Seed<small>Same seed, same songs</small></label>
      <input class="num wide" id="seed" type="text" inputmode="numeric" placeholder="Random" autocomplete="off">
    </div>
    <div class="row">
      <div class="label">Format</div>
      <div class="seg" id="format">
        <button type="button" data-bits="16" aria-pressed="true">16-bit</button>
        <button type="button" data-bits="32" aria-pressed="false">32-bit float</button>
      </div>
    </div>
    <button class="primary" id="go" type="button" disabled>Make 20 songs</button>
    <p class="error" id="error" role="alert"></p>
  </section>

  <section class="card" id="out" aria-labelledby="h-out" hidden>
    <div class="head"><span class="step">3</span><h2 id="h-out">Songs</h2><button class="secondary" id="zip" type="button" disabled>Download all</button></div>
    <p class="meta" id="out-meta"></p>
    <div class="legend" id="legend"></div>
    <ol class="songs" id="songs"></ol>
    <div class="busy-line" id="busy"></div>
  </section>

  <footer>Runs in your browser · nothing is uploaded · <a href="https://github.com/JayPengX/Passion-Beats">Source</a></footer>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
