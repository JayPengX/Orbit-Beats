<style>
:root {
  /* The family's kit (Shared-Proxy kit/quadra.css): iOS 27's colours, light
     and dark, its springs and corners; this page's names for them. */
  --bg: var(--q-page); --card: var(--q-surface); --fill: var(--q-fill-3); --fill-2: var(--q-fill-1); --line: var(--q-sep);
  --text: var(--q-label); --text-2: var(--q-label-2); --text-3: var(--q-label-3);
  --accent: var(--q-pink); --accent-ink: #ffffff; --accent-soft: color-mix(in srgb, var(--q-pink) 14%, transparent); --danger: var(--q-red); --ok: var(--q-green);
  --intro: var(--q-gray); --verse: var(--q-blue); --pre: var(--q-teal, #30b0c7); --hook: var(--q-pink); --break: var(--q-orange); --bridge: var(--q-purple); --outro: var(--q-gray-2);
  --q-accent: var(--q-pink);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* Room at the foot for the tab bar, and the player over it when a song plays. */
main { max-width: 560px; margin: 0 auto; padding: 8px 16px calc(112px + env(safe-area-inset-bottom)); }
body.playing main { padding-bottom: calc(184px + env(safe-area-inset-bottom)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.tab-panel[hidden] { display: none; }

.card { background: var(--card); border-radius: var(--q-r-card); padding: 16px; margin-bottom: 16px; }
.card[hidden] { display: none; }
.head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 32px; }
.head h2 { margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; flex: 1; min-width: 0; }
.head svg { flex: none; width: 22px; height: 22px; color: var(--accent); }

/* 片段 */
.drop {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px;
  border: 1.5px dashed var(--line); background: var(--fill); cursor: pointer;
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { flex: none; color: var(--accent); }
.drop > div { min-width: 0; }
.drop b { display: block; font-weight: 600; }
.drop span { display: block; font-size: 13px; color: var(--text-2); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.ways { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
.way { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600; white-space: nowrap; transition: transform var(--q-dur-snappy) var(--q-spring-snappy); }
.way:active { transform: scale(0.95); }
.way[hidden] { display: none; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--q-red); flex: none; }
.way.on { background: var(--q-red); color: #fff; }
.way.on .rec-dot { background: #fff; animation: pb-rec 1s ease-in-out infinite; }
@keyframes pb-rec { 50% { opacity: .35; } }
.status { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; white-space: nowrap; }
.status[hidden] { display: none; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.status.bad .dot { background: var(--danger); }
.status.busy .dot { background: var(--text-3); }
.status b { font-weight: 600; }
.pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; margin-top: 12px; }
.pieces:empty { display: none; }
.way.danger { background: var(--fill); color: var(--bad, #d70015); }
.piece { position: relative; }
.piece .more { position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--text-2); font-size: 16px; line-height: 1; }
.toast-undo { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; padding: 0 0 0 6px; }
.piece { border-radius: 10px; background: var(--fill); overflow: hidden; }
.piece button {
  display: block; width: 100%; border: 0; background: none; padding: 7px 0 4px; text-align: center;
  font-variant-numeric: tabular-nums; line-height: 1.15;
}
.piece b { display: block; font-size: 15px; font-weight: 600; }
.piece span { display: block; font-size: 11px; color: var(--text-2); }
.piece select {
  display: block; width: 100%; border: 0; border-top: 1px solid var(--fill-2); background: none;
  padding: 5px 4px 6px; font-size: 13px; text-align: center; text-align-last: center; color: var(--text);
}
.piece.off { opacity: 0.5; }
.piece.mine b::after { content: "♪"; margin-left: 2px; color: var(--accent); font-size: 11px; vertical-align: 2px; }
.piece button.on { background: var(--accent); color: var(--accent-ink); }
.piece button.on span { color: inherit; opacity: 0.85; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--text-2); }
.hint[hidden] { display: none; }
.tempo { margin-top: 6px; }
.tempo[hidden] { display: none; }
:is(input, select).num.tempo-num { width: 64px; }
.mini { border: 0; background: var(--fill); border-radius: 8px; height: 32px; min-width: 36px; padding: 0 8px; font-size: 14px; font-weight: 600; }

main details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
main summary { cursor: pointer; color: var(--text-2); font-size: 14px; list-style: none; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
main summary::-webkit-details-marker { display: none; }
main summary::before { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s; margin: 0 3px; }
main details[open] summary::before { transform: rotate(45deg); }

/* Rows of settings */
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 6px 0; }
.row + .row, .row + .stack, .stack + .row, .stack + .stack { border-top: 1px solid var(--line); }
.row > label, .row > .label, .stack > .label { font-weight: 500; white-space: nowrap; min-width: 0; }
.row small, .stack small { display: block; font-size: 12px; font-weight: 400; color: var(--text-2); white-space: nowrap; }
.row.note { flex-wrap: wrap; row-gap: 0; }
.row.note > .label { display: contents; }
.row.note > .label > span { order: 0; margin-right: auto; }
.row.note > .ctl { order: 1; }
.row.note > .label > small { order: 2; flex: 0 0 100%; }
.row[hidden] { display: none; }
.stack { padding: 10px 0; }
.ctl { display: flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
:is(input, select).num {
  width: 56px; height: 36px; border-radius: 9px; border: 0; background: var(--fill);
  text-align: center; font-variant-numeric: tabular-nums; font-size: 16px;
}
:is(input, select).num.wide { width: 104px; }
:is(input, select).num.short { width: 48px; }
:is(input, select).num:focus, main select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.stepper { display: flex; align-items: center; background: var(--fill); border-radius: 9px; height: 36px; }
.stepper button { width: 36px; height: 36px; border: 0; background: none; font-size: 20px; line-height: 1; color: var(--accent); }
.stepper button:disabled { color: var(--text-3); cursor: default; }
.stepper input.num { width: 44px; background: none; }
.unit { color: var(--text-2); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips .chip { flex: 1 0 auto; }
.chip {
  min-width: 0; height: 34px; border-radius: 17px; border: 0; background: var(--fill);
  font-size: 13px; font-weight: 500; white-space: nowrap; padding: 0 10px;
  transition: background-color .2s, color .2s, transform var(--q-dur-snappy) var(--q-spring-snappy);
}
.chip:active { transform: scale(0.95); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg { display: flex; background: var(--fill); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--q-elevated); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
input[type="range"] { width: 120px; accent-color: var(--accent); }
.val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 14px; }
.sheet-card { margin: 0 0 16px; }
.sheet-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.sheet-line .label { font-weight: 500; white-space: nowrap; }
.sheet-row small { display: block; margin-top: 2px; }
.more-row { width: 100%; border: 0; background: none; text-align: left; }
.more-row .chev { color: var(--text-3); font-size: 18px; }

.primary:not(.q-btn) {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; margin-top: 14px; padding: 6px 18px;
  border: 0; border-radius: 25px; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 600; text-align: center; line-height: 1.25;
  transition: transform var(--q-dur-snappy) var(--q-spring-snappy);
}
.primary:not(.q-btn):active:not(:disabled) { transform: scale(0.97); }
.primary:not(.q-btn):disabled { background: var(--fill-2); color: var(--text-3); cursor: default; }
.secondary {
  height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: var(--accent-soft); color: var(--accent);
  font-size: 14px; font-weight: 600; white-space: nowrap; flex: none;
}
.secondary:disabled { opacity: .5; cursor: default; }
.error { margin: 10px 0 0; color: var(--danger); font-size: 14px; white-space: nowrap; }
.error:empty { display: none; }

/* Songs (做歌's batch and 歌單 alike) */
.meta { margin: -6px 0 12px; color: var(--text-2); font-size: 13px; white-space: nowrap; }
.legend { display: grid; grid-template-columns: repeat(6, auto); justify-content: start; gap: 6px 14px; margin-bottom: 4px; font-size: 12px; color: var(--text-2); }
.legend span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
@media (max-width: 420px) { .legend { grid-template-columns: repeat(3, auto); } }
.songs { list-style: none; margin: 0; padding: 0; }
.song { padding: 12px 0; border-top: 1px solid var(--line); }
.song:first-child { border-top: 0; }
.song .line { display: flex; align-items: center; gap: 10px; }
.song .play {
  width: 40px; height: 40px; border-radius: 50%; border: 0; flex: none; display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent);
  transition: transform var(--q-dur-snappy) var(--q-spring-snappy), background-color .2s, color .2s;
}
.song .play:active { transform: scale(0.9); }
.song.now .play { background: var(--accent); color: var(--accent-ink); }
.song .play svg { width: 18px; height: 18px; }
.song .what { flex: 1; min-width: 0; }
.song .name { display: block; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.song .info { display: block; color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.song .info span { white-space: nowrap; }
.song .act {
  width: 36px; height: 36px; border-radius: 18px; border: 0; display: grid; place-items: center; flex: none;
  background: none; color: var(--text-2);
  transition: transform var(--q-dur-snappy) var(--q-spring-snappy), color .2s;
}
.song .act:active { transform: scale(0.85); }
.song .act svg { width: 22px; height: 22px; }
.song .act.kept { color: var(--accent); }
.song .act.kept svg { animation: pb-pop .35s var(--q-spring-snappy); }
@keyframes pb-pop { 40% { transform: scale(1.3); } }
.plan { display: flex; gap: 2px; height: 6px; margin: 10px 0 0 50px; border-radius: 3px; overflow: hidden; position: relative; }
.plan i, .plan .sec { display: block; min-width: 2px; }
.plan { height: 22px; border-radius: 6px; }
.plan .sec { border: 0; padding: 0; margin: 0; height: 100%; cursor: pointer; color: #fff; font: 600 11px/22px var(--q-font, inherit); white-space: nowrap; overflow: hidden; text-align: center; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: opacity .2s; }
.song.now .plan .sec { opacity: .55; }
.song.now .plan .sec.lit { opacity: 1; }
.plan .sec.loop { box-shadow: inset 0 0 0 2px var(--q-label); }
.plan .sec:active { filter: brightness(1.2); }
.song.now .plan::after { content: ""; pointer-events: none; position: absolute; inset: 0 auto 0 0; width: var(--at, 0%); background: color-mix(in srgb, var(--q-label) 28%, transparent); }
.busy-line { color: var(--text-2); font-size: 14px; padding: 14px 0 2px; white-space: nowrap; border-top: 1px solid var(--line); }
.busy-line:empty { display: none; }
.lib-head { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 4px 10px; }
.lib-head h2 { margin: 0; font-size: 28px; font-weight: 700; }
.lib-head small { color: var(--text-2); font-size: 13px; white-space: nowrap; }

/* 樂器 */
.studio-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.studio-top .q-seg { flex: 1; }
.sq { display: grid; grid-template-columns: 26px repeat(8, minmax(0, 1fr)); gap: 3px; margin-top: 12px; }
.sq .corner { position: sticky; top: 0; z-index: 2; background: var(--card); }
.sq .lane {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: center; height: 28px;
  background: var(--card); font-size: 11.5px; font-weight: 600; white-space: nowrap; color: var(--text-2); font-variant-numeric: tabular-nums;
}
.sq .lane.root { color: var(--accent); }
.sq .stepno { display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; height: 28px; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.sq .stepno.beat { color: var(--text-2); font-weight: 600; }
.sq .gap { margin-top: 4px; }
.sq .stepno.bar { border-top: 1px solid var(--line); padding-top: 2px; }
.sq .cell {
  height: 28px; border-radius: 7px; border: 0; padding: 0; background: var(--fill); min-width: 0;
  transition: background-color .12s, transform var(--q-dur-snappy) var(--q-spring-snappy);
}
.sq .cell.beat { background: var(--fill-2); }
.sq .cell.on { background: var(--accent); }
.sq .cell.held { background: color-mix(in srgb, var(--accent) 45%, var(--fill)); }
.sq .cell.now { box-shadow: inset 0 0 0 2px var(--text); }
.sq .cell:active { transform: scale(0.88); }
.transport { display: flex; gap: 8px; margin-top: 14px; }
.transport .q-btn { flex: 1; }
.studio-note { margin: 10px 0 0; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.mine-list { list-style: none; margin: 0; padding: 0; }
.mine-list li { display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid var(--line); }
.mine-list li:first-child { border-top: 0; }
.mine-list .t { flex: 1; min-width: 0; white-space: nowrap; }
.mine-list .t small { display: block; color: var(--text-2); font-size: 12px; }

/* The player: over the tab bar while a song plays */
.player {
  position: fixed; z-index: 55; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--q-bar-gap, 12px) + 74px);
  width: min(calc(100vw - 32px), 528px); display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 8px;
  border-radius: 22px; background: var(--q-glass, var(--card)); -webkit-backdrop-filter: var(--q-glass-blur); backdrop-filter: var(--q-glass-blur);
  box-shadow: var(--q-glass-rim, none), var(--q-glass-drop, 0 8px 24px rgba(0,0,0,.18));
  animation: pb-rise var(--q-dur-smooth) var(--q-spring-smooth) both;
}
.player[hidden] { display: none; }
.player .play { width: 40px; height: 40px; border-radius: 50%; border: 0; flex: none; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); }
.player .play svg { width: 18px; height: 18px; }
.player .what { flex: 1; min-width: 0; }
.player b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; }
.player .bar { position: relative; height: 4px; margin-top: 6px; border-radius: 2px; background: var(--fill-2); overflow: hidden; touch-action: none; }
.player .bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); border-radius: 2px; }
.player time { font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.player .x { width: 30px; height: 30px; border: 0; border-radius: 50%; background: none; color: var(--text-2); font-size: 15px; flex: none; }

/* Movement: a piece playing pulses on the beat (--beat, its tempo's); a
   song made rises in and its sections grow across; a tap gives way. */
.piece button { transition: transform var(--q-dur-snappy) var(--q-spring-snappy), background-color .2s, color .2s; }
.piece button:active { transform: scale(0.95); }
.piece button.on { animation: pb-beat var(--beat, 0.5s) ease-out infinite; }
@keyframes pb-beat { 0% { box-shadow: inset 0 0 0 0 rgba(255,255,255,.35); } 15% { box-shadow: inset 0 0 0 3px rgba(255,255,255,.35); } 100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); } }
.song { animation: pb-rise var(--q-dur-smooth) var(--q-spring-smooth) both; }
.song .plan i, .song .plan .sec { transform-origin: left; animation: pb-grow .6s var(--q-spring-smooth) both; animation-delay: calc(min(var(--k, 0) * 40ms, 400ms) + 120ms); }
@keyframes pb-rise { from { opacity: 0; transform: translateY(12px); } }
.player { animation-name: pb-rise-x; }
@keyframes pb-rise-x { from { opacity: 0; transform: translate(-50%, 16px); } }
@keyframes pb-grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) {
  .piece button, .song .play, .song .act, .chip, .sq .cell { transition: none; }
  .piece button.on, .song, .song .plan i, .song .plan .sec, .jam-pad.on, .player, .song .act.kept svg { animation: none; }
}

/* 編排: a song's sections as a list to move, repeat and take out. */
.arr { list-style: none; margin: 4px 0 10px; padding: 0; }
.arr li { display: flex; align-items: center; gap: 6px; min-height: 44px; border-top: 1px solid var(--line); }
.arr li:first-child { border-top: 0; }
.arr li > i { width: 6px; height: 26px; border-radius: 3px; flex: none; }
.arr .ctl { margin-left: auto; }
.arr .mini:disabled { opacity: .4; }
.player .repeat { position: relative; }
.player .repeat svg { width: 17px; height: 17px; }
.player .repeat[data-mode="one"], .player .repeat[data-mode="section"] { color: var(--accent); }
.player .repeat b { position: absolute; right: 1px; bottom: 1px; font-size: 9px; line-height: 1; }

/* 樂器: the drums' two sets, the clip's tools, the shelf. */
.studio-tools { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.studio-tools .mini { padding: 0 4px; font-size: 13px; white-space: nowrap; }
.studio-tools .mini[hidden] { display: none; }
.studio-tools .mini[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.studio-tools .mini:disabled { opacity: .4; }
.sq .cell.accent { background: color-mix(in srgb, var(--accent) 100%, #000 18%); box-shadow: inset 0 0 0 2px var(--accent-ink); }
.sq .cell.chord { background: var(--q-purple); }
.sq .cell.on.soft { background: color-mix(in srgb, var(--accent) 50%, var(--fill)); box-shadow: inset 0 0 0 1.5px var(--accent); }
.sq .cell { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.chain-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chain { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.chain .slot { height: 32px; min-width: 0; padding: 0; border: 0; border-radius: 8px; background: var(--fill); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chain .slot.edit { background: none; color: var(--accent); font-size: 20px; font-weight: 500; }
.chain .slot.edit:nth-last-child(2) { grid-column: 9; }
.chain .slot.edit:last-child { grid-column: 10; }
.chain .slot:disabled { opacity: .35; }
.chain .slot.now { box-shadow: inset 0 0 0 2px var(--text); }
.chain-head .label { font-weight: 500; white-space: nowrap; min-width: 0; }

/* 即興: the pads, the transport, the take. */
.jam-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.jam-bar .q-btn { flex: 1; }
.jam-beat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin: 0 0 12px; }
.jam-beat i { height: 6px; border-radius: 3px; background: var(--fill); }
.jam-beat i.on { background: var(--accent); }
.pads { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.jam-pad { aspect-ratio: 1; border: 0; border-radius: 14px; background: var(--fill); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 15px; font-weight: 600; color: var(--text); touch-action: manipulation; user-select: none; -webkit-user-select: none; transition: transform var(--q-dur-snappy) var(--q-spring-snappy), background-color .15s; }
.jam-pad small { font-size: 11px; font-weight: 400; color: var(--text-2); white-space: nowrap; }
.jam-pad.loop { box-shadow: inset 0 0 0 2px var(--fill-2); }
.jam-pad.wait { box-shadow: inset 0 0 0 2px var(--accent); }
.jam-pad.on { background: var(--accent); color: var(--accent-ink); }
.jam-pad.on small { color: inherit; opacity: .85; }
.jam-pad.hit { transform: scale(0.92); background: color-mix(in srgb, var(--accent) 55%, var(--fill)); }
.jam-pad { position: relative; overflow: hidden; -webkit-touch-callout: none; }
.jam-pad:not(.leveled) .lvl { display: none; }
.jam-pad .lvl { position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--lvl, 1) * 100%); background: var(--accent); opacity: .55; }
.jam-pad.on .lvl { background: var(--accent-ink); }
.jam-pad.muted { opacity: .4; }
.jam-pad[data-choke]:not([data-choke=""])::after { content: attr(data-choke); position: absolute; top: 5px; right: 7px; font-size: 10px; font-weight: 700; color: var(--text-2); }
.jam-pad.on::after { color: inherit; }
.jam-pad-sheet input[type="range"] { width: 150px; }
.jam-pad-sheet .pct { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.stack > .q-seg { margin-top: 8px; }
.jam-rec.on { background: var(--q-red); color: #fff; }

/* 歌單: search and order. */
.lib-tools { display: flex; gap: 8px; align-items: center; margin: 0 0 12px; }
.lib-tools input { flex: 1; min-width: 0; height: 36px; border: 0; border-radius: 10px; background: var(--fill); padding: 0 12px; font: inherit; color: inherit; }
.lib-tools select { height: 36px; border: 0; border-radius: 10px; background: var(--fill); padding: 0 8px; font: inherit; color: inherit; }
/* 歌單: playlists. */
.lib-lists .q-list { margin: -6px -16px -16px; background: none; }
.lib-nav { display: flex; justify-content: space-between; align-items: center; margin: 0 0 4px; }
.lib-back, .lib-more { height: 36px; border: 0; background: none; color: var(--accent); font-size: 17px; padding: 0 4px; white-space: nowrap; }
.lib-more { width: 44px; font-size: 22px; font-weight: 700; }
.lib-head h2 { min-width: 0; overflow-wrap: anywhere; }
.card > .primary:first-child { margin-top: 0; margin-bottom: 8px; }

/* ⓘ: a word in everyday words (lib/help.mjs). */
.info-btn { display: inline-grid; place-items: center; width: 22px; height: 22px; margin: -4px 0 -4px 2px; padding: 0; border: 0; border-radius: 50%; background: none; color: var(--accent); font-size: 15px; line-height: 1; vertical-align: middle; flex: none; }
.legend-line { display: flex; align-items: flex-start; gap: 6px; }
.legend-line .legend { flex: 1; min-width: 0; }
.term-text { margin: 0 0 4px; font-size: 16px; line-height: 1.5; }
.listen { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin-top: 14px; }
.listen .q-btn { padding: 0 8px; font-size: 15px; white-space: nowrap; }
.listen .q-btn.on { background: var(--accent); color: var(--accent-ink); }
.terms { list-style: none; margin: 0; padding: 0; }
.terms button { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 6px 0; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
.terms li:first-child button { border-top: 0; }
.terms button > div { flex: 1; min-width: 0; }
.terms b { display: block; font-weight: 600; white-space: nowrap; }
.terms small { display: block; color: var(--text-2); font-size: 13px; white-space: nowrap; }
.terms .chev, .more-row .chev { color: var(--text-3); }

/* 聽: the radio. Each song's own cover (lib/cover.mjs) crossfades in; its bars
   and a breath of the cover land on the song's beat (--beat, the clock set
   from the player's time); the card takes a tint of the cover's colour. */
@property --amb { syntax: '<color>'; inherits: true; initial-value: #ff2d55; }
@property --amb-2 { syntax: '<color>'; inherits: true; initial-value: #af52de; }
.radio-card {
  padding: 20px; --tint: 16%;
  background: radial-gradient(140% 75% at 50% 0%, color-mix(in srgb, var(--amb) var(--tint), var(--card)), var(--card) 78%);
  transition: --amb 1.2s ease, --amb-2 1.2s ease;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .radio-card { --tint: 30%; } }
:root[data-theme='dark'] .radio-card { --tint: 30%; }
.radio-art {
  position: relative; aspect-ratio: 1; width: 100%; max-width: 360px; margin: 0 auto; border-radius: 18px; overflow: hidden; background: color-mix(in srgb, var(--amb) 40%, var(--fill));
  box-shadow: 0 22px 44px -22px color-mix(in srgb, var(--amb) 80%, transparent); transition: box-shadow 1.2s;
}
.radio-art .covers { position: absolute; inset: 0; }
.radio-art img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; opacity: 0; transition: opacity .8s ease; }
.radio-art img.in { opacity: 1; }
.radio-art .eq { position: absolute; right: 16px; bottom: 16px; z-index: 1; display: flex; align-items: flex-end; gap: 4px; height: 26px; }
.radio-art .eq i { width: 5px; height: 26%; border-radius: 3px; background: rgba(255,255,255,.92); box-shadow: 0 1px 6px rgba(0,0,0,.18); }
/* On the beat: each bar a hit then a fall, on 8ths, beats or half notes, offset by 16ths. */
.radio-art .eq i:nth-child(1) { --m: 1; --o: 0; }
.radio-art .eq i:nth-child(2) { --m: .5; --o: .25; }
.radio-art .eq i:nth-child(3) { --m: 2; --o: .5; }
.radio-art .eq i:nth-child(4) { --m: 1; --o: .5; }
.radio-art .eq i:nth-child(5) { --m: .5; --o: 0; }
.radio-card.on .radio-art .eq i { animation: pb-bar calc(var(--beat, .5s) * var(--m)) cubic-bezier(.2,.6,.35,1) infinite; animation-delay: calc(var(--beat, .5s) * var(--o) * -1); }
.radio-card.on .radio-art .covers { animation: pb-thump var(--beat, .5s) cubic-bezier(.2,.7,.3,1) infinite; }
.radio-card.wait .radio-art .eq i { animation: pb-eq 1.1s ease-in-out infinite alternate; animation-delay: calc(var(--k) * -0.2s); opacity: .7; }
@keyframes pb-bar { 0% { height: 100%; } 100% { height: 22%; } }
@keyframes pb-thump { 0% { transform: scale(1.016); } 40%, 100% { transform: scale(1); } }
@keyframes pb-eq { 0% { height: 18%; } 50% { height: 100%; } 100% { height: 42%; } }
.radio-what { margin: 18px 2px 0; min-width: 0; }
.radio-title { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; overflow-wrap: anywhere; }
.radio-sub { margin: 4px 0 0; color: var(--text-2); font-size: 14px; }
.radio-bar { position: relative; height: 4px; margin-top: 16px; border-radius: 2px; background: var(--fill-2); overflow: hidden; }
.radio-bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, var(--amb) 55%, var(--text)); border-radius: 2px; }
.radio-time { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.radio-ctl { display: flex; align-items: center; justify-content: center; gap: 28px; margin-top: 8px; }
.radio-play { width: 76px; height: 76px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 24px -10px var(--accent); transition: transform var(--q-dur-snappy) var(--q-spring-snappy); }
.radio-play svg { width: 32px; height: 32px; }
.radio-play:active { transform: scale(.92); }
.radio-btn { width: 52px; height: 52px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--fill); color: var(--text); transition: transform var(--q-dur-snappy) var(--q-spring-snappy), color .2s; }
.radio-btn svg { width: 24px; height: 24px; }
.radio-btn:active { transform: scale(.88); }
.radio-btn:disabled { opacity: .4; }
.radio-btn.kept { color: var(--accent); }
.radio-btn.kept svg { animation: pb-pop .35s var(--q-spring-snappy); }
.radio-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; min-height: 34px; }
.radio-next { flex: 1; min-width: 0; margin: 0; color: var(--text-2); font-size: 13px; overflow-wrap: anywhere; }
.radio-sleep { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; min-width: 34px; padding: 0 9px; border: 0; border-radius: 17px; background: var(--fill); color: var(--text-2); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; transition: transform var(--q-dur-snappy) var(--q-spring-snappy); }
.radio-sleep svg { width: 16px; height: 16px; flex: none; }
.radio-sleep:active { transform: scale(.92); }
.radio-sleep.on { background: var(--accent-soft); color: var(--accent); }
.radio-more { margin-top: 12px; }
.radio-moods { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.radio-moods .chip { flex: 1 0 auto; padding: 0 12px; height: 38px; border-radius: 19px; font-size: 15px; }
.radio-recent { list-style: none; margin: -6px 0 -8px; padding: 0; }
.radio-recent li { display: flex; align-items: center; gap: 12px; min-height: 60px; border-top: 1px solid var(--line); }
.radio-recent li:first-child { border-top: 0; }
.radio-recent img { flex: none; width: 44px; height: 44px; border-radius: 8px; display: block; }
.radio-recent li > div { flex: 1; min-width: 0; }
.radio-recent b { display: block; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.radio-recent small { display: block; color: var(--text-2); font-size: 13px; }
.radio-love { flex: none; width: 44px; height: 44px; margin-right: -10px; border: 0; background: none; display: grid; place-items: center; color: var(--text-3); }
.radio-love svg { width: 22px; height: 22px; }
.radio-love.kept { color: var(--accent); }
.radio-love.kept svg { animation: pb-pop .35s var(--q-spring-snappy); }
@media (max-width: 360px) { .radio-moods { gap: 6px; } .radio-moods .chip { padding: 0 8px; } .radio-card { padding: 16px; } .radio-ctl { gap: 22px; } }
@media (prefers-reduced-motion: reduce) {
  .radio-card .radio-art .eq i, .radio-card .radio-art .covers, .radio-love.kept svg { animation: none !important; }
  .radio-art img, .radio-card { transition: none; }
}

/* 樂器 in 簡單: write one again, or add it, right above the grid. */
.easy-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.easy-row .q-btn { min-height: 50px; padding: 0 10px; font-size: 15px; white-space: nowrap; }
.q-btn.solid { background: var(--accent); color: var(--accent-ink); }
.easy-hint { text-align: center; }

footer { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 8px; white-space: nowrap; }
</style>
</head>
<body>
<div id="loading" data-title="Orbit Beats" data-cache="beats-"></div>
<!-- kit:boot: right after <div id="loading">. -->
<script>document.write('<script src="'+QUADRA_KIT.url('boot.js')+'"><\/script>')</script>
<!-- /kit:boot -->
<header class="q-appbar">
  <div class="q-appbar-inner">
    <div class="q-brand">
      <img class="q-brand-logo" src="./favicon.svg" alt="" width="34" height="34">
      <div class="q-brand-text">
        <h1 id="title">Orbit Beats</h1>
        <p id="badge" class="q-status" aria-live="polite" data-en="Music that never stops">聽不完的音樂，也做自己的歌</p>
      </div>
    </div>
    <nav id="tabs" class="q-tabbar" role="tablist"></nav>
    <div id="top-actions" class="q-actions"></div>
  </div>
</header>
<main>
  <div id="panel-listen" class="tab-panel" role="tabpanel"></div>

  <div id="panel-make" class="tab-panel" role="tabpanel" hidden>
    <section class="card pieces-card" aria-labelledby="h-rec">
      <div class="head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10"/></svg><h2 id="h-rec" data-en="Pieces">片段</h2></div>
      <label class="drop" id="drop">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
        <div><b data-en="Choose recordings or samples">選錄音或取樣檔</b><span data-en="One file or a whole pack · split by silence">一個檔或一整包 · 依安靜切開</span></div>
        <input type="file" id="file" accept="audio/*,.wav" multiple>
      </label>
      <div class="ways">
        <button class="way" id="record" type="button"><span class="rec-dot" aria-hidden="true"></span><span id="record-text" data-en="Record">用麥克風錄</span></button>
        <button class="way" id="add" type="button" hidden data-en="Add files">再加檔案</button>
        <button class="way" id="demo" type="button" data-en="Demo">試試示範</button>
        <button class="way" id="to-studio" type="button" data-en="Use Studio">用樂器做</button>
      </div>
      <input type="file" id="more" accept="audio/*,.wav" multiple hidden>
      <div class="status" id="status" hidden><span class="dot"></span><span id="status-text"></span></div>
      <div class="ways" id="kit-tools">
        <button class="way" id="my-kits" type="button" data-en="My kits">我的套組</button>
        <button class="way" id="save-kit" type="button" hidden data-en="Save as kit">存成套組</button>
        <button class="way danger" id="clear-all" type="button" hidden data-en="Clear all">全部清除</button>
      </div>
      <div class="row tempo note" id="tempo-row" data-ctl="make-tempo" hidden>
        <label class="label" for="bpm"><span><span data-en="Tempo">速度</span> <button class="info-btn" type="button" data-term="bpm" aria-label="說明：速度" data-en-label="What is tempo?">ⓘ</button></span><small id="bpm-hint"></small></label>
        <div class="ctl">
          <button class="mini" type="button" id="bpm-half" aria-label="速度減半" data-en-label="Half the tempo">½</button>
          <input class="num tempo-num" id="bpm" type="number" min="40" max="250" step="0.1" inputmode="decimal">
          <span class="unit">BPM</span>
          <button class="mini" type="button" id="bpm-double" aria-label="速度加倍" data-en-label="Double the tempo">×2</button>
          <button class="mini" type="button" id="bpm-tap" aria-label="跟著點拍子" data-en-label="Tap the tempo" data-en="Tap">點拍</button>
        </div>
      </div>
      <div class="pieces" id="pieces" aria-label="片段：點一下試聽" data-en-label="Pieces: tap one to hear it"></div>
      <p class="hint" id="pieces-hint" hidden><span data-en="Tap one to hear it">點片段試聽</span><span data-ctl="make-roles"><span data-en=" · roles are guesses, tap to change"> · 角色是聽出來的，可以改</span> <button class="info-btn" type="button" data-term="roles" aria-label="說明：角色" data-en-label="What are roles?">ⓘ</button></span></p>
      <details id="split-more" data-ctl="make-split">
        <summary data-en="Splitting">切片</summary>
        <div class="row">
          <label for="silence"><span data-en="Silence below">安靜門檻</span><small data-en="Raise it for noisy phone audio">手機錄的雜音多就調高</small></label>
          <div class="ctl"><input class="num" id="silence" type="number" min="-140" max="-30" step="5" value="-90"><span class="unit">dB</span></div>
        </div>
        <div class="row">
          <label for="gap"><span data-en="Shortest gap">最短間隔</span><small data-en="Silence between two pieces">兩段之間的安靜</small></label>
          <div class="ctl"><input class="num" id="gap" type="number" min="0.05" max="3" step="0.05" value="0.2"><span class="unit" data-en="sec">秒</span></div>
        </div>
        <button class="secondary" id="resplit" type="button" disabled data-en="Split again">重新切片</button>
      </details>
    </section>

    <section class="card" aria-labelledby="h-set">
      <div class="head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><h2 id="h-set" data-en="Make songs">做歌</h2></div>
      <div class="stack" data-ctl="make-moods">
        <div class="label"><span data-en="Mood">情境</span><small id="mood-hint" data-en="Picks the grooves for you">幫你挑節奏</small></div>
        <div class="chips five" id="moods"></div>
      </div>
      <div class="stack" data-ctl="make-styles">
        <div class="label"><span><span data-en="Drums">鼓的風格</span> <button class="info-btn" type="button" data-term="groove" aria-label="說明：鼓的風格" data-en-label="What are drum styles?">ⓘ</button></span><small data-en="Each song picks its grooves from these">每首從這些挑節奏</small></div>
        <div class="chips" id="styles"></div>
      </div>
      <div class="row" id="taste-row" data-ctl="make-taste" hidden>
        <label for="smart"><span data-en="Lean to your taste">依你的口味</span><small id="taste-hint"></small></label>
        <span id="smart-slot"></span>
      </div>
      <div class="row" data-ctl="make-count">
        <label for="count" data-en="Songs">首數</label>
        <div class="stepper">
          <button type="button" id="count-down" aria-label="少一首" data-en-label="Fewer songs">−</button>
          <input class="num" id="count" type="number" min="1" max="30" value="8" inputmode="numeric">
          <button type="button" id="count-up" aria-label="多一首" data-en-label="More songs">+</button>
        </div>
      </div>
      <button class="more-row row" id="mix-settings" type="button" data-ctl="make-mix"><span class="label"><span data-en="Mix">混音</span><small id="mix-hint"></small></span><span class="chev" aria-hidden="true">›</span></button>
      <button class="more-row row" id="more-settings" type="button" data-ctl="make-more"><span class="label"><span data-en="More settings">更多設定</span><small id="more-hint"></small></span><span class="chev" aria-hidden="true">›</span></button>
      <button class="primary" id="go" type="button" disabled></button>
      <p class="hint easy-hint" id="easy-hint" data-ctl="make-easy"></p>
      <p class="error" id="error" role="alert"></p>
      <div class="ways" data-ctl="make-open"><button class="way" id="open-song" type="button" data-en="Open a file">打開檔案</button></div>
      <input type="file" id="song-file" accept=".json,application/json" hidden>
    </section>

    <section class="card" id="out" aria-labelledby="h-out" hidden>
      <div class="head"><h2 id="h-out" data-en="Songs">新歌</h2><button class="secondary" id="zip" type="button" disabled data-en="Download all">全部下載</button></div>
      <p class="meta" id="out-meta" data-ctl="make-meta"></p>
      <div class="legend-line"><div class="legend" id="legend"></div><button class="info-btn" type="button" data-term="section" aria-label="說明：段落" data-en-label="What are sections?">ⓘ</button></div>
      <ol class="songs" id="songs"></ol>
      <div class="busy-line" id="busy"></div>
    </section>
    <footer data-en="Runs on your phone · nothing is uploaded">全部在手機上做 · 什麼都不上傳</footer>
  </div>

  <div id="panel-studio" class="tab-panel" role="tabpanel" hidden></div>

  <div id="panel-jam" class="tab-panel" role="tabpanel" hidden></div>

  <div id="panel-library" class="tab-panel" role="tabpanel" hidden></div>
</main>

<div class="player" id="player" hidden>
  <button class="play" id="player-play" type="button" aria-label="暫停"></button>
  <div class="what"><b id="player-name"></b><div class="bar" id="player-bar"><i id="player-at"></i></div></div>
  <time id="player-time">0:00</time>
  <button class="x repeat" id="player-repeat" type="button" aria-label="播完接下一首" data-en-label="Then the next song"></button>
  <button class="x" id="player-x" type="button" aria-label="關閉播放器" data-en-label="Close the player">✕</button>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
