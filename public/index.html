<style>
:root {
  /* The family's kit (Orbit-Core kit/orbit.css): iOS 27's colours, light
     and dark, its springs and corners; this page's names for them. */
  --bg: var(--q-page); --card: var(--q-surface); --fill: var(--q-fill-3); --fill-2: var(--q-fill-1); --line: var(--q-sep);
  --text: var(--q-label); --text-2: var(--q-label-2); --text-3: var(--q-label-3);
  --accent: var(--q-accent, var(--q-pink)); --accent-ink: #ffffff; --accent-soft: color-mix(in srgb, var(--accent) 14%, transparent); --danger: var(--q-red); --ok: var(--q-green);
  --intro: var(--q-gray); --verse: var(--q-indigo); --pre: var(--q-teal, #30b0c7); --hook: var(--q-pink); --break: var(--q-orange); --bridge: var(--q-purple); --outro: var(--q-gray-2);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
/* (No overscroll-behavior on html or body: in the home-screen app on iPhone it stops the page scrolling at all.) */
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* Room at the foot for the tab bar, and the player over it when a song plays. */
main { padding: 8px 16px calc(112px + env(safe-area-inset-bottom)); }
body.playing main { padding-bottom: calc(184px + env(safe-area-inset-bottom)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.tab-panel[hidden] { display: none; }

.card { background: var(--card); border-radius: var(--q-r-card); padding: 16px; margin-bottom: 16px; }
.card[hidden] { display: none; }
.head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; min-height: 32px; }
.head[hidden] { display: none; }
.head h2 { margin: 0; font-size: 17px; font-weight: 600; white-space: nowrap; flex: 1; min-width: 0; }
.head svg { flex: none; width: 22px; height: 22px; color: var(--accent); }

/* 片段 */
.drop {
  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px;
  border: 1.5px dashed var(--line); background: var(--fill); cursor: pointer;
}
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { flex: none; color: var(--accent); }
.drop > div { min-width: 0; }
.drop b { display: block; font-weight: 600; }
.drop span { display: block; font-size: 13px; color: var(--text-2); }
.drop input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.ways { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
.way { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 0; border-radius: 17px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600; white-space: nowrap; transition: transform var(--q-dur-snappy) var(--q-spring-snappy); }
.way:active { transform: scale(0.95); }
.way[hidden] { display: none; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--q-red); flex: none; }
.way.on { background: var(--q-red); color: #fff; }
.way.on .rec-dot { background: #fff; animation: pb-rec 1s ease-in-out infinite; }
@keyframes pb-rec { 50% { opacity: .35; } }
.status { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; white-space: nowrap; }
.status[hidden] { display: none; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.status.bad .dot { background: var(--danger); }
.status.busy .dot { background: var(--text-3); }
.status b { font-weight: 600; }
.pieces { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 6px; margin-top: 12px; }
.pieces:empty { display: none; }
.way.danger { background: var(--fill); color: var(--bad, #d70015); }
.piece { position: relative; }
.piece .more { position: absolute; top: 0; right: 0; width: 44px; height: 44px; padding: 0; border: 0; background: none; color: var(--text-2); font-size: 16px; line-height: 1; }
.toast-undo { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 700; padding: 0 0 0 6px; }
.piece { border-radius: 10px; background: var(--fill); overflow: hidden; }
.piece button {
  display: block; width: 100%; border: 0; background: none; padding: 7px 0 4px; text-align: center;
  font-variant-numeric: tabular-nums; line-height: 1.15;
}
.piece b { display: block; font-size: 15px; font-weight: 600; }
.piece span { display: block; font-size: 11px; color: var(--text-2); }
.piece select {
  display: block; width: 100%; border: 0; border-top: 1px solid var(--fill-2); background: none;
  padding: 5px 4px 6px; font-size: 13px; text-align: center; text-align-last: center; color: var(--text);
}
.piece.off { opacity: 0.5; }
.piece button.on { background: var(--accent); color: var(--accent-ink); }
.piece button.on span { color: inherit; opacity: 0.85; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--text-2); }
.hint[hidden] { display: none; }
.tempo { margin-top: 6px; }
.tempo[hidden] { display: none; }
:is(input, select).num.tempo-num { width: 64px; }
.mini { border: 0; background: var(--fill); border-radius: 8px; height: 32px; min-width: 36px; padding: 0 8px; font-size: 14px; font-weight: 600; }

main details { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
main summary { cursor: pointer; color: var(--text-2); font-size: 14px; list-style: none; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
main summary::-webkit-details-marker { display: none; }
main summary::before { content: ""; width: 6px; height: 6px; border: solid currentColor; border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg); transition: transform .15s; margin: 0 3px; }
main details[open] summary::before { transform: rotate(45deg); }

/* Rows of settings */
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 6px 0; }
.row + .row, .row + .stack, .stack + .row, .stack + .stack { border-top: 1px solid var(--line); }
.row > label, .row > .label, .stack > .label { font-weight: 500; white-space: nowrap; min-width: 0; }
.row small, .stack small { display: block; font-size: 12px; font-weight: 400; color: var(--text-2); white-space: nowrap; }
.row.note { flex-wrap: wrap; row-gap: 0; }
.row.note > .label { display: contents; }
.row.note > .label > span { order: 0; margin-right: auto; }
.row.note > .ctl { order: 1; }
.row.note > .label > small { order: 2; flex: 0 0 100%; }
.row[hidden] { display: none; }
.stack { padding: 10px 0; }
.ctl { display: flex; align-items: center; gap: 6px; white-space: nowrap; flex: none; }
:is(input, select).num {
  width: 56px; height: 36px; border-radius: 9px; border: 0; background: var(--fill);
  text-align: center; font-variant-numeric: tabular-nums; font-size: 16px;
}
:is(input, select).num.wide { width: 104px; }
:is(input, select).num.short { width: 48px; }
:is(input, select).num:focus, main select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.stepper { display: flex; align-items: center; background: var(--fill); border-radius: 9px; height: 36px; }
.stepper button { width: 36px; height: 36px; border: 0; background: none; font-size: 20px; line-height: 1; color: var(--accent); }
.stepper button:disabled { color: var(--text-3); cursor: default; }
.stepper input.num { width: 44px; background: none; }
.unit { color: var(--text-2); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips .chip { flex: 1 0 auto; }
.chip {
  min-width: 0; height: 34px; border-radius: 17px; border: 0; background: var(--fill);
  font-size: 13px; font-weight: 500; white-space: nowrap; padding: 0 10px;
  transition: background-color .2s, color .2s, transform var(--q-dur-snappy) var(--q-spring-snappy);
}
.chip:active { transform: scale(0.95); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg { display: flex; background: var(--fill); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--q-elevated); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
input[type="range"] { width: 120px; accent-color: var(--accent); }
.val { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); font-size: 14px; }
.sheet-card { margin: 0 0 16px; }
.sheet-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; }
.sheet-line .label { font-weight: 500; white-space: nowrap; }
.sheet-row small { display: block; margin-top: 2px; }
.more-row { width: 100%; border: 0; background: none; text-align: left; }
.more-row .chev { color: var(--text-3); font-size: 18px; }

.primary:not(.q-btn) {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; margin-top: 14px; padding: 6px 18px;
  border: 0; border-radius: 25px; background: var(--accent); color: var(--accent-ink); font-size: 17px; font-weight: 600; text-align: center; line-height: 1.25;
  transition: transform var(--q-dur-snappy) var(--q-spring-snappy);
}
.primary:not(.q-btn):active:not(:disabled) { transform: scale(0.97); }
.primary:not(.q-btn):disabled { background: var(--fill-2); color: var(--text-3); cursor: default; }
.secondary {
  height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: var(--accent-soft); color: var(--accent);
  font-size: 14px; font-weight: 600; white-space: nowrap; flex: none;
}
.secondary:disabled { opacity: .5; cursor: default; }
.error { margin: 10px 0 0; color: var(--danger); font-size: 14px; white-space: nowrap; }
.error:empty { display: none; }

/* Songs (做歌's batch and 歌單 alike) */
.meta { margin: -6px 0 12px; color: var(--text-2); font-size: 13px; white-space: nowrap; }
.legend { display: grid; grid-template-columns: repeat(6, auto); justify-content: start; gap: 6px 14px; margin-bottom: 4px; font-size: 12px; color: var(--text-2); }
.legend span { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.legend i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
@media (max-width: 420px) { .legend { grid-template-columns: repeat(3, auto); } }
.songs { list-style: none; margin: 0; padding: 0; }
.song { padding: 12px 0; border-top: 1px solid var(--line); }
.song:first-child { border-top: 0; }
.song .line { display: flex; align-items: center; gap: 10px; }
/* (The whole row plays: cover and name are one button; ♡ and ⋯ stand beside it.) */
.song .main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; margin: -4px 0 -4px -6px; padding: 4px 6px; border: 0; border-radius: 14px; background: none; color: inherit; text-align: left; -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: background-color .15s; }
.song .main:active { background: var(--fill); }
.song .play {
  position: relative; display: block; width: 52px; height: 52px; padding: 0; border-radius: 10px; flex: none; overflow: hidden; background: var(--fill);
  box-shadow: 0 3px 10px rgba(0,0,0,.18); transition: transform var(--q-dur-snappy) var(--q-spring-snappy);
}
.song .main:active .play { transform: scale(0.94); }
.song .sc { display: block; width: 100%; height: 100%; object-fit: cover; }
.song .si { position: absolute; inset: 0; display: grid; place-items: center; color: #fff; background: rgba(0,0,0,.3); opacity: 0; transition: opacity .15s; }
.song .main:hover .si, .song .main:focus-visible .si, .song.now .si { opacity: 1; }
.song .si svg { width: 22px; height: 22px; }
.song .what { display: block; flex: 1; min-width: 0; }
.song .name { display: block; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.song .info { display: block; color: var(--text-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.song .info span { white-space: nowrap; }
.song .act {
  width: 36px; height: 36px; border-radius: 18px; border: 0; display: grid; place-items: center; flex: none;
  background: none; color: var(--text-2);
  transition: transform var(--q-dur-snappy) var(--q-spring-snappy), color .2s;
}
.song .act:active { transform: scale(0.85); }
.song .act svg { width: 22px; height: 22px; }
.song .act.kept { color: var(--accent); }
.song .act.kept svg { animation: pb-pop .35s var(--q-spring-snappy); }
@keyframes pb-pop { 40% { transform: scale(1.3); } }
.song:not(.now) .plan { display: none; }
.plan { display: flex; gap: 2px; height: 6px; margin: 10px 0 0 62px; border-radius: 3px; overflow: hidden; position: relative; }
.plan i, .plan .sec { display: block; min-width: 2px; }
.plan { height: 22px; border-radius: 6px; }
.plan .sec { border: 0; padding: 0; margin: 0; height: 100%; cursor: pointer; color: #fff; font: 600 11px/22px var(--q-font, inherit); white-space: nowrap; overflow: hidden; text-align: center; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent; transition: opacity .2s; }
.song.now .plan .sec.lit { box-shadow: inset 0 -3px 0 rgba(255,255,255,.9); }
.plan .sec.loop { box-shadow: inset 0 0 0 2px var(--q-label); }
.plan .sec:active { filter: brightness(1.2); }
.song.now .plan::after { content: ""; pointer-events: none; position: absolute; inset: 0 auto 0 0; width: var(--at, 0%); background: color-mix(in srgb, var(--q-label) 28%, transparent); }
/* 資料庫 */
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
#panel-library > .q-list-group { margin-top: 12px; }
.lib-dim { opacity: .45; pointer-events: none; }
.lib-sec { margin: 22px 0 0; }
.lib-sec-t { margin: 0 4px 8px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.lib-sec .q-list-group { margin: 0; }
.lib-shelf { margin: 22px 0 0; }
.lib-shelf h2 { margin: 0 0 12px; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.lib-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 14px; }
.lib-card { position: relative; min-width: 0; }
.lib-cover { display: block; width: 100%; aspect-ratio: 1; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: var(--fill); box-shadow: 0 8px 18px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.1); transition: transform var(--q-dur-snappy) var(--q-spring-snappy); -webkit-tap-highlight-color: transparent; }
.lib-cover:active { transform: scale(.96); }
.lib-cover img, .lib-mosaic img, .lib-rec-cover { display: block; width: 100%; height: 100%; object-fit: cover; }
.lib-card b, .lib-card small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-card b { margin-top: 9px; font-size: 15px; font-weight: 600; }
.lib-card small { margin-top: 1px; font-size: 13px; color: var(--text-2); }
.lib-card-more { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; color: #fff; background: rgba(0,0,0,.35); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.lib-card-more svg { width: 18px; height: 18px; }
.lib-recs { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 16px; overflow: hidden; }
.lib-rec { display: flex; align-items: center; gap: 4px; padding-right: 8px; border-top: 1px solid var(--line); }
.lib-rec:first-child { border-top: 0; }
.lib-rec-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 8px 0 8px 12px; border: 0; background: none; color: var(--text); text-align: left; }
.lib-rec-cover { flex: none; width: 52px; height: 52px; border-radius: 10px; background: var(--fill); }
.lib-rec-text { flex: 1; min-width: 0; }
.lib-rec-text b, .lib-rec-text small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-rec-text b { font-size: 16px; font-weight: 600; }
.lib-rec-text small { font-size: 13px; color: var(--text-2); }
.lib-rec .act { flex: none; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; color: var(--accent); }
.lib-rec .act svg { width: 22px; height: 22px; }
.lib-actions { display: flex; flex-direction: column; gap: 10px; margin: 22px 0 0; }
.lib-actions button, .lib-pill { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.lib-actions button { min-height: 50px; border-radius: 14px; font-size: 17px; font-weight: 600; }
.lib-actions svg, .lib-pill svg { width: 20px; height: 20px; flex: none; }
.lib-nav { display: flex; align-items: center; justify-content: space-between; gap: 4px; min-height: 44px; margin: 0 -8px 8px; }
.lib-nav-title { flex: 1; margin: 0; font-size: 17px; font-weight: 600; text-align: center; }
.lib-back, .lib-btn { flex: none; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--accent); }
.lib-back svg, .lib-btn svg { width: 24px; height: 24px; }
.lib-btns { display: flex; }
.lib-tools { margin: 0 0 12px; }
.lib-tools input { width: 100%; height: 36px; border: 0; border-radius: 10px; background: var(--fill); padding: 0 12px; font: inherit; color: inherit; }
.lib-none { margin: 0; padding: 12px 0; color: var(--text-2); text-align: center; }
.lib-mosaic { display: block; overflow: hidden; border-radius: 12px; background: var(--fill); box-shadow: 0 8px 18px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.1); }
.lib-mosaic.four { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
.lib-mosaic.blank { display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }
.lib-mosaic.sm { flex: none; width: 52px; height: 52px; border-radius: 9px; box-shadow: none; }
.lib-mosaic.lg { width: 176px; height: 176px; border-radius: 16px; }
.lib-mosaic.blank svg { width: 40%; height: 40%; }
.lib-lrows { background: var(--card); border-radius: 16px; overflow: hidden; }
.lib-lrow { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 12px; border: 0; border-top: 1px solid var(--line); background: none; color: var(--text); text-align: left; }
.lib-lrow:first-child { border-top: 0; }
.lib-ltext { flex: 1; min-width: 0; }
.lib-ltext b, .lib-ltext small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-ltext b { font-size: 16px; font-weight: 600; }
.lib-ltext small { font-size: 13px; color: var(--text-2); }
.lib-chev { flex: none; color: var(--text-3); }
.lib-chev svg { width: 18px; height: 18px; }
.lib-hero { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 0 0 16px; }
.lib-hero h2 { max-width: 100%; margin: 0; font-size: 26px; font-weight: 600; text-align: center; overflow-wrap: anywhere; }
.lib-pills { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 0 0 18px; }
.lib-pill { height: 48px; border: 0; border-radius: 14px; background: var(--accent-soft); color: var(--accent); font-size: 17px; font-weight: 600; }
.lib-pill:disabled { opacity: .4; }
.lib-pill:active { transform: scale(.97); }
.lib-check svg { width: 20px; height: 20px; color: var(--accent); }

/* 樂器: ▶, 🎲 and the chips; the grid a lane a drum (its colour, its name
   over it) and 16 steps across, four to a beat; 存成片段 under it. The steps
   are as wide as the card allows, gaps drawn inside them, so each is a
   finger-sized target even at 320 px. */
.studio .head { gap: 8px; }
.studio .head .q-seg { flex: 0 1 180px; }
.st-top { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.st-play {
  flex: none; width: 52px; height: 52px; border: 0; border-radius: 50%; padding: 0; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 38%, transparent);
  touch-action: manipulation; transition: transform var(--q-dur-snappy) var(--q-spring-snappy), background-color .15s;
}
.st-play svg { width: 24px; height: 24px; fill: currentColor; }
.st-play.on { background: var(--accent-soft); color: var(--accent); box-shadow: none; }
.st-play:active { transform: scale(0.9); }
.st-top .st-dice { background: var(--accent-soft); box-shadow: none; }
.st-chips { flex: 1; }
.st-chips.st-few { flex: 1 0 100%; flex-wrap: wrap; overflow: visible; -webkit-mask-image: none; mask-image: none; }
.st-chips.st-few .chip:last-child { margin-right: 0; }
.chip.st-morechip, .chip.rx-more { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); background: var(--accent-soft); }
.st-morechip svg, .rx-more svg { width: 14px; height: 14px; }
.st-chips.st-along { -webkit-mask-image: linear-gradient(90deg, transparent, #000 28px, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 28px, #000 88%, transparent); }
.st-pages { display: flex; gap: 6px; margin-top: 12px; }
.st-pages[hidden] { display: none; }
.st-pages button { flex: 1; height: 30px; border: 0; border-radius: 15px; background: var(--fill); font-size: 13px; font-weight: 600; color: var(--text-2); touch-action: manipulation; white-space: nowrap; }
.st-pages button[aria-pressed="true"] { background: var(--text); color: var(--card); }
.st-pages button.now:not([aria-pressed="true"]) { box-shadow: inset 0 0 0 2px var(--accent); }
.st-grid { margin-top: 10px; }
.st-head, .st-cells { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); }
.st-head span { position: relative; height: 16px; padding-left: 3px; font-size: 11px; font-weight: 600; line-height: 16px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.st-head span.beat { color: var(--text-2); }
.st-head span::after { content: ""; position: absolute; left: 50%; bottom: 1px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); opacity: 0; transition: opacity .06s; }
.st-head span.now::after { opacity: 1; }
.st-lane { --c: var(--accent); margin-top: 4px; }
.st-name { display: flex; align-items: center; gap: 5px; height: 17px; padding-left: 3px; font-size: 12px; font-weight: 600; white-space: nowrap; color: color-mix(in srgb, var(--c) 58%, var(--text)); }
.st-name i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.st-cells .cell {
  position: relative; height: 34px; min-width: 0; border: 0; padding: 0; background: none;
  touch-action: pan-y; /* (a slide along the lane paints; only an up-down swipe scrolls) */ -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
.st-cells .cell::before {
  content: ""; position: absolute; inset: 2px 1.5px; border-radius: 6px;
  background: color-mix(in srgb, var(--c) 14%, var(--fill));
  transition: background-color .12s, transform var(--q-dur-snappy) var(--q-spring-snappy), box-shadow .08s;
}
.st-cells .cell.alt::before { background: color-mix(in srgb, var(--c) 7%, var(--fill-2)); }
.st-cells .cell.g0::before { left: 3.5px; }
.st-cells .cell.g3::before { right: 3.5px; }
.st-cells .cell.held::before { background: color-mix(in srgb, var(--c) 42%, var(--fill)); }
.st-cells .cell.on::before { background: var(--c); }
.st-cells .cell.on.soft::before { background: color-mix(in srgb, var(--c) 48%, var(--fill)); }
/* An accent: a white dot in it; a chord: a ring. */
.st-cells .cell.accent::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
.st-cells .cell.chord::before { box-shadow: inset 0 0 0 2px rgba(255,255,255,.75); }
.st-cells .cell.now::before { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--text) 45%, transparent); }
.st-cells .cell.on.now::before { transform: scale(1.1); box-shadow: 0 0 10px color-mix(in srgb, var(--c) 70%, transparent); }
.st-cells .cell:active::before { transform: scale(0.84); }
.st-more { display: block; margin: 8px auto 0; height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: none; color: var(--accent); font-size: 14px; font-weight: 600; touch-action: manipulation; }
.st-more[hidden] { display: none; }
.st-actions { display: flex; align-items: center; gap: 8px; margin-top: 14px; }
.st-icon { flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; padding: 0; display: grid; place-items: center; background: var(--fill); color: var(--text); touch-action: manipulation; transition: transform var(--q-dur-snappy) var(--q-spring-snappy); }
.st-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.st-icon:active { transform: scale(0.9); }
.st-icon:disabled { opacity: .35; }
.st-add {
  flex: 1; min-width: 0; height: 48px; border: 0; border-radius: 24px; padding: 0 12px; background: var(--accent); color: var(--accent-ink);
  font-size: clamp(14px, 4.3vw, 16px); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; touch-action: manipulation;
  transition: transform var(--q-dur-snappy) var(--q-spring-snappy), opacity .15s;
}
.st-add:active { transform: scale(0.96); }
.st-add:disabled { opacity: .4; }
.st-pro > :first-child { margin-top: 12px; border-top: 1px solid var(--line); }
/* (At 320 the card gives the grid its side margins: 16 steps of 18 px.) */
@media (max-width: 360px) { .card.studio { margin-inline: -8px; padding-inline: 8px; } }
.mine-list { list-style: none; margin: 0; padding: 0; }
.mine-list li { display: flex; align-items: center; gap: 10px; min-height: 44px; border-top: 1px solid var(--line); }
.mine-list li:first-child { border-top: 0; }
.mine-list .t { flex: 1; min-width: 0; white-space: nowrap; }
.mine-list .t small { display: block; color: var(--text-2); font-size: 12px; }

/* The player: over the tab bar while a song plays */
/* Movement: a piece playing pulses on the beat (--beat, its tempo's); a
   song made rises in and its sections grow across; a tap gives way. */
.piece button { transition: transform var(--q-dur-snappy) var(--q-spring-snappy), background-color .2s, color .2s; }
.piece button:active { transform: scale(0.95); }
.piece button.on { animation: pb-beat var(--beat, 0.5s) ease-out infinite; }
@keyframes pb-beat { 0% { box-shadow: inset 0 0 0 0 rgba(255,255,255,.35); } 15% { box-shadow: inset 0 0 0 3px rgba(255,255,255,.35); } 100% { box-shadow: inset 0 0 0 0 rgba(255,255,255,0); } }
.song { animation: pb-rise var(--q-dur-smooth) var(--q-spring-smooth) both; }
.song .plan i, .song .plan .sec { transform-origin: left; animation: pb-grow .6s var(--q-spring-smooth) both; animation-delay: calc(min(var(--k, 0) * 40ms, 400ms) + 120ms); }
@keyframes pb-rise { from { opacity: 0; transform: translateY(12px); } }
@keyframes pb-rise-x { from { opacity: 0; transform: translate(-50%, 16px); } }
@keyframes pb-grow { from { transform: scaleX(0); } }
@media (prefers-reduced-motion: reduce) {
  .piece button, .song .play, .song .act, .chip, .st-grid .cell::before { transition: none; }
  .piece button.on, .song, .song .plan i, .song .plan .sec, .jam-pad.on, .player, .song .act.kept svg { animation: none; }
}

/* 編排: a song's sections as a list to move, repeat and take out. */
.arr { list-style: none; margin: 4px 0 10px; padding: 0; }
.arr li { display: flex; align-items: center; gap: 6px; min-height: 44px; border-top: 1px solid var(--line); }
.arr li:first-child { border-top: 0; }
.arr li > i { width: 6px; height: 26px; border-radius: 3px; flex: none; }
.arr .ctl { margin-left: auto; }
.arr .mini:disabled { opacity: .4; }

/* 樂器: the drums' two sets, the clip's tools, the shelf. */
.studio-tools { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
.studio-tools .mini { padding: 0 4px; font-size: 13px; white-space: nowrap; }
.studio-tools .mini[hidden] { display: none; }
.studio-tools .mini[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.studio-tools .mini:disabled { opacity: .4; }
.chain-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.chain { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.chain .slot { height: 32px; min-width: 0; padding: 0; border: 0; border-radius: 8px; background: var(--fill); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chain .slot.edit { background: none; color: var(--accent); font-size: 20px; font-weight: 500; }
.chain .slot.edit:nth-last-child(2) { grid-column: 9; }
.chain .slot.edit:last-child { grid-column: 10; }
.chain .slot:disabled { opacity: .35; }
.chain .slot.now { box-shadow: inset 0 0 0 2px var(--text); }
.chain-head .label { font-weight: 500; white-space: nowrap; min-width: 0; }

/* 即興: the set (🎲 and the grooves), the transport, the beat, the pads in their colours. */
.jam .head { justify-content: space-between; gap: 12px; }
.jam .head .jam-src { flex: 0 1 200px; }
.jam-src[hidden] { display: none; }
.jam-set { margin: 0 0 14px; }
.jam-set[hidden] { display: none; }
.jam-set-row { display: flex; align-items: center; gap: 8px; }
.jam-dice { flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--accent); font-size: 22px; line-height: 1; box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); transition: transform var(--q-dur-snappy) var(--q-spring-bouncy); touch-action: manipulation; }
.jam-dice:active { transform: scale(0.88) rotate(-25deg); }
.jam-chips { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; min-width: 0; padding: 2px 0; -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); }
.jam-chips::-webkit-scrollbar { display: none; }
.jam-chips .chip { flex: none; padding: 0 14px; font-size: 14px; touch-action: manipulation; }
.jam-chips .chip:last-child { margin-right: 24px; }
.jam-meta { margin: 8px 0 0; font-size: 13px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.jam-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.jam-bar .q-btn { flex: 1; min-width: 0; padding-inline: 8px; font-size: clamp(14px, 4.4vw, 17px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; touch-action: manipulation; }
.jam-bar .q-btn.plain { flex: none; }
.jam-bar .jam-play { flex: 1.2; background: var(--accent); color: var(--accent-ink); }
.jam-bar .jam-play.on { background: var(--accent-soft); color: var(--accent); }
.jam-beat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 0 12px; }
.jam-beat span { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
.jam-beat i { height: 6px; border-radius: 3px; background: var(--fill); transition: background-color .08s; }
.jam-beat span i:first-child { background: var(--fill-2); }
.jam-beat span i.past { background: color-mix(in srgb, var(--accent) 30%, var(--fill)); }
.jam-beat span i.on { background: var(--accent); }
.pads { position: relative; z-index: 0; isolation: isolate; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; transition: opacity .2s; }
.jam-bar { position: relative; z-index: 1; }
.jam-bar button > *, .jam-set button > * { pointer-events: none; }
.pads.making, .jam-tiles.making, .jam-hits.making { opacity: .55; }
.making .jam-pad { animation: jam-ready 1.1s ease-in-out infinite alternate; }
@keyframes jam-ready { to { opacity: .7; } }
.jam-pad {
  --c: var(--accent); position: relative; overflow: hidden; aspect-ratio: 1; border: 0; border-radius: 16px; padding: 4px 2px;
  background: color-mix(in srgb, var(--c) 15%, var(--card)); color: color-mix(in srgb, var(--c) 62%, var(--text));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 22%, transparent);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  transition: transform var(--q-dur-snappy) var(--q-spring-snappy), background-color .15s, color .15s, box-shadow .15s;
}
.jam-pad { --ink: #fff; }
.jam-pad[data-fam="drum"] { --c: var(--q-orange); --ink: #3d1a00; }
.jam-pad[data-fam="hat"] { --c: var(--q-yellow); --ink: #3a2a00; }
.jam-pad[data-fam="bass"] { --c: var(--q-blue); }
.jam-pad[data-fam="chords"] { --c: var(--q-indigo); }
.jam-pad[data-fam="melody"] { --c: var(--q-pink); }
.jam-pad[data-fam="hat"] { color: color-mix(in srgb, var(--c) 40%, var(--text)); }
.jam-pad b { font-size: clamp(10.5px, 3.4vw, 15px); font-weight: 700; line-height: 1.15; text-align: center; letter-spacing: -0.02em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.jam-pad small { font-size: clamp(10px, 2.8vw, 11px); font-weight: 500; opacity: .75; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.jam-pad.loop { padding-top: 12px; }
.jam-pad .mark { position: absolute; top: 4px; left: 7px; font-style: normal; font-size: 11px; font-weight: 700; opacity: .7; }
.jam-pad.wait { animation: jam-wait .45s ease-in-out infinite alternate; box-shadow: inset 0 0 0 2.5px var(--c); }
@keyframes jam-wait { to { background: color-mix(in srgb, var(--c) 35%, var(--card)); } }
.jam-pad.on { background: var(--c); color: var(--ink); box-shadow: 0 6px 16px color-mix(in srgb, var(--c) 45%, transparent); }
/* (A hit: the pad's own colour, full, its label in the dark or white that reads on it.) */
.jam-pad.hit { transform: scale(0.92); background: var(--c); color: var(--ink); transition-duration: .05s; }
.jam-pad:not(.leveled) .lvl { display: none; }
.jam-pad .lvl { position: absolute; left: 0; bottom: 0; height: 3px; width: calc(var(--lvl, 1) * 100%); background: currentColor; opacity: .55; }
.jam-pad.muted { opacity: .4; }
.jam-pad[data-choke]:not([data-choke=""])::after { content: attr(data-choke); position: absolute; top: 5px; right: 7px; font-size: 10px; font-weight: 700; color: inherit; opacity: .75; }
@media (prefers-reduced-motion: reduce) { .jam-pad.wait, .making .jam-pad { animation: none; } }
.jam-pad-sheet input[type="range"] { width: 150px; }
.jam-pad-sheet .pct { width: 40px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text-2); }
.stack > .q-seg { margin-top: 8px; }
.jam-rec.on { background: var(--q-red); color: #fff; }


/* 創作: the path. */
.hub-hero { position: relative; aspect-ratio: 16 / 10; border-radius: 22px; overflow: hidden; background: var(--fill); margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 26px rgba(0,0,0,.07); }
.hub-hero .hub-cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center top; }
.hub-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.5), transparent 60%); pointer-events: none; }
.hub-open { position: absolute; inset: 0; width: 100%; border: 0; background: none; padding: 0; z-index: 1; }
.hub-hero > b { position: absolute; left: 16px; bottom: 14px; z-index: 2; font-size: 22px; font-weight: 600; color: #fff; pointer-events: none; }
.hub-play { position: absolute; right: 14px; bottom: 12px; z-index: 2; width: 52px; height: 52px; border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.3); touch-action: manipulation; }
.hub-play svg { width: 24px; height: 24px; }
.hub-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hub-half { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; min-height: 108px; padding: 16px; border: 0; border-radius: 22px; background: var(--card); color: var(--text); text-align: left; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 26px rgba(0,0,0,.07); touch-action: manipulation; }
.hub-half .hub-ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.hub-half .hub-ico svg { width: 24px; height: 24px; }
.hub-half b { font-size: 20px; font-weight: 600; }
.hub-badge { position: absolute; top: 14px; right: 14px; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 700 13px/24px var(--q-font, inherit); font-style: normal; text-align: center; font-variant-numeric: tabular-nums; }
.hub-badge[hidden] { display: none; }

/* 即興 簡單: the set card, the band's board, the hits. */
.jam-set { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; }
.jam-set.mine .jam-art, .jam-set.mine .jam-cover, .jam-set.mine .jam-name, .jam-set.mine .jam-dice, .jam-set.mine .jam-undo { display: none; }
.jam-set.mine .jam-id { flex: 1; }
.jam-cover { flex: none; width: 56px; height: 56px; padding: 0; border: 0; border-radius: 14px; overflow: hidden; background: var(--fill); touch-action: manipulation; }
.jam-cover img { display: block; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }

.hub-game-t b { font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
.hub-game-t span { font-size: 15px; color: rgba(255,255,255,.82); }
.hub-game-go { position: relative; flex: none; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: #fff; color: #2a1460; }
/* No white in dark mode (Jay 2026-10-21): the hero's play and the game's go are glass. */
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .hero-play, :root:not([data-theme='light']) .hub-game-go { background: rgba(255,255,255,.2); color: #fff; box-shadow: none; } }
:root[data-theme='dark'] .hero-play, :root[data-theme='dark'] .hub-game-go { background: rgba(255,255,255,.2); color: #fff; box-shadow: none; }
.hub-game-go svg { width: 22px; height: 22px; margin-left: 2px; }

/* The ? sheet: the four screens as rows. */
.tours { padding: 4px 16px; }
.tour { display: flex; align-items: center; gap: 8px; }
.tour + .tour { border-top: .5px solid var(--line); }
.tour-go { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 12px 0; border: 0; background: none; color: var(--text); text-align: left; touch-action: manipulation; }
.tour-ico { flex: none; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.tour-ico svg { width: 24px; height: 24px; }
.tour-text { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.tour-text b { font-size: 17px; font-weight: 600; }
.tour-text small { font-size: 14px; color: var(--text-2); }
.tour-play { flex: none; width: 40px; height: 40px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); touch-action: manipulation; transition: transform var(--q-dur-snappy) var(--q-spring-snappy); }
.tour-play:active { transform: scale(.9); }
.tour-play svg { width: 18px; height: 18px; }
.q-cell .level-label { flex: 1; min-width: 0; }
.more-row .chev svg, .terms .chev svg { width: 18px; height: 18px; display: block; }

/* A ⋯ menu: the song on top, the page dimmed behind. */
.q-menu { max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; }
/* Design pass: empty-state lines break evenly. */
.q-empty p { text-wrap: balance; }
</style>
</head>
<body>
<div id="loading" data-title="Orbit Beats"></div>
<!-- kit:boot: right after <div id="loading">. -->
<script>document.write('<script src="'+ORBIT_KIT.url('boot.js')+'"><\/script>')</script>
<!-- /kit:boot -->
<header class="q-appbar">
  <div class="q-appbar-inner">
    <div class="q-brand">
      <img class="q-brand-logo" src="./favicon.svg" alt="" width="34" height="34">
      <div class="q-brand-text">
        <h1 id="title">Orbit Beats</h1>
        <p id="badge" class="q-status" aria-live="polite" data-en="Music that never stops">聽不完的音樂，也做自己的歌</p>
      </div>
      <!-- A screen opened from 創作: its back chevron and name in the bar's own line, beside the account's capsule. -->
      <div class="subnav" id="subnav" hidden><button type="button" id="subnav-back" aria-label="返回" data-en-label="Back"></button><span class="subnav-title" id="subnav-title" role="heading" aria-level="1"></span></div>
    </div>
    <nav id="tabs" class="q-tabbar" role="tablist"></nav>
    <div id="top-actions" class="q-actions"></div>
  </div>
</header>
<main>
  <div id="panel-home" class="tab-panel" role="tabpanel"></div>

  <div id="panel-create" class="tab-panel" role="tabpanel" hidden></div>

  <div id="panel-make" class="tab-panel" role="tabpanel" hidden>
    <section class="card pieces-card" aria-labelledby="h-rec">
      <div class="head"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12h2M7 8v8M11 5v14M15 9v6M19 7v10"/></svg><h2 id="h-rec"><span data-ctl="make-card" data-en="Pieces">片段</span><span data-ctl="make-ingredients" data-en="Ingredients">材料</span></h2></div>
      <label class="drop" id="drop" data-ctl="make-card">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>
        <div><b data-en="Choose recordings or samples">選錄音或取樣檔</b><span data-en="One file or a whole pack · split by silence">一個檔或一整包 · 依安靜切開</span></div>
        <input type="file" id="file" accept="audio/*,.wav" multiple>
      </label>
      <div class="ways src">
        <button class="way" id="record" type="button"><span class="rec-dot" aria-hidden="true"></span><span id="record-text" data-en="Record">用麥克風錄</span></button>
        <button class="way" id="add" type="button" hidden data-en="Add files">再加檔案</button>
        <button class="way" id="demo" type="button" data-en="Demo">試試示範</button>
        <button class="way" id="to-studio" type="button" data-en="Use Studio">用樂器做</button>
      </div>
      <input type="file" id="more" accept="audio/*,.wav" multiple hidden>
      <div class="status" id="status" hidden><span class="dot"></span><span id="status-text"></span></div>
      <div class="ways" id="kit-tools" data-ctl="make-card">
        <button class="way" id="my-kits" type="button" data-en="My kits">我的套組</button>
        <button class="way" id="save-kit" type="button" hidden data-en="Save as kit">存成套組</button>
        <button class="way danger" id="clear-all" type="button" hidden data-en="Clear all">全部清除</button>
      </div>
      <div class="row tempo note" id="tempo-row" data-ctl="make-tempo" hidden>
        <label class="label" for="bpm"><span><span data-en="Tempo">速度</span> <button class="info-btn" type="button" data-term="bpm" aria-label="說明：速度" data-en-label="What is tempo?">ⓘ</button></span><small id="bpm-hint"></small></label>
        <div class="ctl">
          <button class="mini" type="button" id="bpm-half" aria-label="速度減半" data-en-label="Half the tempo">½</button>
          <input class="num tempo-num" id="bpm" type="number" min="40" max="250" step="0.1" inputmode="decimal">
          <span class="unit">BPM</span>
          <button class="mini" type="button" id="bpm-double" aria-label="速度加倍" data-en-label="Double the tempo">×2</button>
          <button class="mini" type="button" id="bpm-tap" aria-label="跟著點拍子" data-en-label="Tap the tempo" data-en="Tap">點拍</button>
        </div>
      </div>
      <div class="pieces" id="pieces" aria-label="片段：點一下試聽" data-en-label="Pieces: tap one to hear it"></div>
      <p class="hint" id="pieces-hint" hidden><span data-en="Tap one to hear it">點片段試聽</span><span data-ctl="make-roles"><span data-en=" · roles are guesses, tap to change"> · 角色是聽出來的，可以改</span> <button class="info-btn" type="button" data-term="roles" aria-label="說明：角色" data-en-label="What are roles?">ⓘ</button></span></p>
      <details id="split-more" data-ctl="make-split">
        <summary data-en="Splitting">切片</summary>
        <div class="row">
          <label for="silence"><span data-en="Silence below">安靜門檻</span><small data-en="Raise it for noisy phone audio">手機錄的雜音多就調高</small></label>
          <div class="ctl"><input class="num" id="silence" type="number" min="-140" max="-30" step="5" value="-90"><span class="unit">dB</span></div>
        </div>
        <div class="row">
          <label for="gap"><span data-en="Shortest gap">最短間隔</span><small data-en="Silence between two pieces">兩段之間的安靜</small></label>
          <div class="ctl"><input class="num" id="gap" type="number" min="0.05" max="3" step="0.05" value="0.2"><span class="unit" data-en="sec">秒</span></div>
        </div>
        <button class="secondary" id="resplit" type="button" disabled data-en="Split again">重新切片</button>
      </details>
    </section>

    <section class="card" aria-labelledby="h-set">
      <div class="head" data-ctl="make-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><h2 id="h-set" data-en="Make songs">做歌</h2></div>
      <div class="stack" data-ctl="make-moods">
        <div class="label"><span data-en="Mood">情境</span><small id="mood-hint" data-en="Picks the grooves for you">幫你挑節奏</small></div>
        <div class="chips five" id="moods"></div>
      </div>
      <div class="stack" data-ctl="make-styles">
        <div class="label"><span><span data-en="Drums">鼓的風格</span> <button class="info-btn" type="button" data-term="groove" aria-label="說明：鼓的風格" data-en-label="What are drum styles?">ⓘ</button></span><small data-en="Each song picks its grooves from these">每首從這些挑節奏</small></div>
        <div class="chips" id="styles"></div>
      </div>
      <div class="row" id="taste-row" data-ctl="make-taste" hidden>
        <label for="smart"><span data-en="Lean to your taste">依你的口味</span><small id="taste-hint"></small></label>
        <span id="smart-slot"></span>
      </div>
      <div class="row" data-ctl="make-count">
        <label for="count" data-en="Songs">首數</label>
        <div class="stepper">
          <button type="button" id="count-down" aria-label="少一首" data-en-label="Fewer songs">−</button>
          <input class="num" id="count" type="number" min="1" max="30" value="8" inputmode="numeric">
          <button type="button" id="count-up" aria-label="多一首" data-en-label="More songs">+</button>
        </div>
      </div>
      <button class="more-row row" id="mix-settings" type="button" data-ctl="make-mix"><span class="label"><span data-en="Mix">混音</span><small id="mix-hint"></small></span><span class="chev" aria-hidden="true">›</span></button>
      <button class="more-row row" id="more-settings" type="button" data-ctl="make-more"><span class="label"><span data-en="More settings">更多設定</span><small id="more-hint"></small></span><span class="chev" aria-hidden="true">›</span></button>
      <button class="primary" id="go" type="button" disabled></button>
      <p class="hint easy-hint" id="easy-hint" data-ctl="make-easy"></p>
      <p class="error" id="error" role="alert"></p>
      <div class="ways" data-ctl="make-open"><button class="way" id="open-song" type="button" data-en="Open a file">打開檔案</button></div>
      <input type="file" id="song-file" accept=".json,application/json" hidden>
    </section>

    <section class="card" id="out" aria-labelledby="h-out" hidden>
      <div class="head"><h2 id="h-out" data-en="Songs">新歌</h2><button class="secondary" id="zip" type="button" disabled data-en="Download all">全部下載</button></div>
      <p class="meta" id="out-meta" data-ctl="make-meta"></p>
      <div class="legend-line" data-ctl="make-legend"><div class="legend" id="legend"></div><button class="info-btn" type="button" data-term="section" aria-label="說明：段落" data-en-label="What are sections?">ⓘ</button></div>
      <ol class="songs" id="songs"></ol>
    </section>
    <footer data-en="Runs on your phone · nothing is uploaded">全部在手機上做 · 什麼都不上傳</footer>
  </div>

  <div id="panel-studio" class="tab-panel" role="tabpanel" hidden></div>

  <div id="panel-jam" class="tab-panel" role="tabpanel" hidden></div>

  <div id="panel-library" class="tab-panel" role="tabpanel" hidden></div>
</main>

<div class="player" id="player" hidden>
  <button class="mp-main" type="button" aria-label="正在播放" data-en-label="Now playing"><img class="mp-cover" alt=""><span class="mp-text"><b class="mp-title"></b><small class="mp-sub"></small></span></button>
  <button class="mp-btn mp-play" type="button" aria-label="播放" data-en-label="Play"></button>
  <button class="mp-btn mp-next" type="button" aria-label="下一首" data-en-label="Next"></button>
  <i class="mp-at"></i>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
